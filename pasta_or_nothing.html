<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Μακαρόνια ή τίποτα</title>
<style>
:root{--bg:#f6d365;--ink:#3b1d0e;--tomato:#c8321f;--ok:#1f7a3a;--card:#fff8e1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:20px;
background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 28px)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,6vw,3.6rem);margin:0;letter-spacing:-.02em;text-align:center}
p.sub{margin:0;max-width:46ch;text-align:center;font-size:1.05rem}
#drop{width:min(560px,100%);min-height:280px;background:var(--card);border:4px dashed var(--ink);border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;padding:12px;transition:background .15s}
#drop.over,#drop:focus-visible{background:#fff;outline:3px solid var(--tomato)}
#drop img{max-width:100%;max-height:420px;border-radius:10px}
#status{font-weight:bold;min-height:1.4em;text-align:center}
#result{width:min(560px,100%);border-radius:18px;padding:22px;text-align:center;display:none}
#result.win{display:block;background:var(--ok);color:#fff}
#result.lose{display:block;background:var(--tomato);color:#fff}
#result h2{margin:0 0 6px;font-family:Georgia,serif;font-size:1.7rem;line-height:1.25}
#result small{opacity:.85}
#secret{display:none;width:min(760px,100%);background:#000;border-radius:14px;padding:14px;text-align:center}
#secret p{color:#f6d365;margin:0 0 10px;font-weight:bold}
#secret img{width:100%;height:auto;image-rendering:pixelated}
#modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#modes button[aria-pressed="false"]{background:transparent;color:var(--ink)}
#cam{width:min(560px,100%);display:none;flex-direction:column;gap:10px;align-items:center}
#cam video{width:100%;border-radius:18px;border:4px solid var(--ink);background:#000;transform:scaleX(-1)}
#cam.on{display:flex}
#meter{width:100%;height:14px;border-radius:999px;background:rgba(59,29,14,.2);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--tomato);transition:width .3s,background .3s}
#meter.hit i{background:var(--ok)}
button{font:inherit;padding:10px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Μακαρόνια ή τίποτα 🍝</h1>
<p class="sub">Δείξε στην κάμερα ή ανέβασε φωτογραφία. Το πρόγραμμα αναγνωρίζει μόνο ζυμαρικά και noodles.</p>

<div id="modes">
  <button id="modeCam" aria-pressed="true">📷 Κάμερα (live)</button>
  <button id="modePhoto" aria-pressed="false">🖼️ Φωτογραφία</button>
</div>

<div id="cam" class="on">
  <video id="video" autoplay playsinline muted></video>
  <div id="meter" aria-hidden="true"><i></i></div>
</div>

<label id="drop" style="display:none" tabindex="0" for="file">
  <span id="hint">Πάτα εδώ ή σύρε μια φωτογραφία</span>
  <img id="preview" alt="" hidden>
</label>
<input id="file" type="file" accept="image/*" hidden>

<div id="status">Φόρτωση μοντέλου αναγνώρισης… (την πρώτη φορά κατεβάζει ~150MB)</div>
<div id="result" role="status" aria-live="polite"></div>

<script type="module">
import { env, AutoTokenizer, AutoProcessor, CLIPTextModelWithProjection, CLIPVisionModelWithProjection, RawImage } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
env.allowLocalModels = false;
env.useBrowserCache = false; // avoids Cache API failures on file://

const WIN_MSG = "Αν τρως μακαρόνια συγχαρητήρια, είσαι νικητής της ζωής! 🏆";
const LOSE_MSG = "Αυτό δεν είναι μακαρόνια. Δοκίμασε ξανά με ζυμαρικά ή noodles.";

const PASTA = ["a photo of spaghetti","a photo of pasta","a photo of noodles","a photo of ramen noodles","a photo of macaroni","a photo of penne pasta"];
const OTHER = ["a photo of pizza","a photo of rice","a photo of bread","a photo of a salad","a photo of meat","a photo of a burger","a photo of a dessert","a photo of soup without noodles","a photo of a person","a photo of an animal","a photo of a landscape","a photo of a building","a photo of a car","a photo of a screenshot","a photo of an everyday object","a photo of vegetables","a photo of a fruit"];
const LABELS = [...PASTA, ...OTHER];
const THRESHOLD = 0.5; // ελάχιστη συνολική πιθανότητα για ζυμαρικά

const $ = id => document.getElementById(id);
let classifier = false, processor, visionModel, textEmb, DIM = 512;
const MODEL_ID = "Xenova/clip-vit-base-patch32";
const l2 = (arr, off, n) => { let s = 0; for(let i=0;i<n;i++) s += arr[off+i]*arr[off+i]; s = Math.sqrt(s) || 1; const o = new Float32Array(n); for(let i=0;i<n;i++) o[i] = arr[off+i]/s; return o; };
try {
  const tokenizer = await AutoTokenizer.from_pretrained(MODEL_ID);
  const textModel = await CLIPTextModelWithProjection.from_pretrained(MODEL_ID);
  processor = await AutoProcessor.from_pretrained(MODEL_ID);
  visionModel = await CLIPVisionModelWithProjection.from_pretrained(MODEL_ID);
  // Οι ετικέτες κωδικοποιούνται ΜΙΑ φορά εδώ. Ανά καρέ τρέχει μόνο το μοντέλο εικόνας.
  const { text_embeds } = await textModel(tokenizer(LABELS, { padding: true, truncation: true }));
  DIM = text_embeds.dims[1];
  textEmb = LABELS.map((_, i) => l2(text_embeds.data, i*DIM, DIM));
  classifier = true;
  $("status").textContent = "Έτοιμο!";
} catch (e) {
  $("status").innerHTML = "Αποτυχία φόρτωσης μοντέλου: " + (e && e.message ? e.message : e) + "<br><small>Άνοιξε το αρχείο σε κανονικό browser (Chrome/Firefox/Edge), όχι μέσα σε preview, με internet και χωρίς adblock. Ή τρέξε <code>python -m http.server</code> στον φάκελο και άνοιξε http://localhost:8000/makaronia.html</small>";
  console.error(e);
}

const LIVE_HITS = 2;   // διαδοχικά καρέ με ζυμαρικά για να κερδίσεις
const LIVE_MISSES = 3; // διαδοχικά καρέ χωρίς ζυμαρικά για να χαθεί η νίκη

async function classify(image){ // image: RawImage
  const { image_embeds } = await visionModel(await processor(image));
  const v = l2(image_embeds.data, 0, DIM);
  const logits = textEmb.map(te => { let d = 0; for(let i=0;i<DIM;i++) d += v[i]*te[i]; return 100*d; });
  const mx = Math.max(...logits), ex = logits.map(x => Math.exp(x-mx)), sum = ex.reduce((a,b)=>a+b, 0);
  const probs = ex.map(x => x/sum);
  const pastaScore = probs.slice(0, PASTA.length).reduce((a,b)=>a+b, 0);
  const top = probs.indexOf(Math.max(...probs));
  const isPasta = top < PASTA.length && pastaScore >= THRESHOLD;
  return { isPasta, pct: Math.round(pastaScore*100) };
}
function showResult(isPasta, pct){
  const r = $("result");
  r.className = isPasta ? "win" : "lose";
  r.innerHTML = `<h2>${isPasta ? WIN_MSG : LOSE_MSG}</h2><small>Βεβαιότητα για ζυμαρικά: ${pct}%</small>`;
  $("secret").style.display = isPasta ? "block" : "none";
}
function clearResult(){ $("result").className = ""; $("result").style.display = ""; $("secret").style.display = "none"; }

/* ---------- Φωτογραφία ---------- */
async function handle(file){
  if(!file || !classifier) return;
  const url = URL.createObjectURL(file);
  $("preview").src = url; $("preview").hidden = false; $("hint").hidden = true;
  clearResult();
  $("status").textContent = "Αναλύω…";
  try{
    const { isPasta, pct } = await classify(await RawImage.read(url));
    showResult(isPasta, pct);
    $("status").textContent = "";
  }catch(e){ $("status").textContent = "Κάτι πήγε στραβά με την ανάλυση."; console.error(e); }
}
$("file").addEventListener("change", e => handle(e.target.files[0]));
const drop = $("drop");
drop.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click();} });
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop", e => handle(e.dataTransfer.files[0]));

/* ---------- Live κάμερα ---------- */
const video = $("video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
let stream = null, running = false, hits = 0, misses = 0, won = false;

async function startCamera(){
  if(stream) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $("status").textContent = "Η κάμερα δεν υποστηρίζεται εδώ. Χρειάζεται https ή http://localhost.";
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:640 } }, audio:false });
    video.srcObject = stream;
    await video.play();
    running = true; hits = misses = 0; won = false;
    loop();
  }catch(e){
    stream = null;
    $("status").textContent = "Δεν δόθηκε πρόσβαση στην κάμερα: " + (e.message || e.name) + ". Επίτρεψε την κάμερα στον browser και δοκίμασε ξανά.";
  }
}
function stopCamera(){
  running = false;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  video.srcObject = null;
}
async function loop(){
  canvas.width = 224; canvas.height = 224;
  let last = performance.now(), fps = 0;
  while(running){
    if(classifier && video.videoWidth){
      const vw = video.videoWidth, vh = video.videoHeight, s = Math.min(vw, vh);
      ctx.drawImage(video, (vw-s)/2, (vh-s)/2, s, s, 0, 0, 224, 224);
      try{
        const id = ctx.getImageData(0, 0, 224, 224);
        const { isPasta, pct } = await classify(new RawImage(id.data, 224, 224, 4).rgb());
        if(!running) break;
        const now = performance.now(); fps = 0.7*fps + 0.3*(1000/(now-last)); last = now;
        const m = $("meter"); m.firstElementChild.style.width = pct + "%"; m.classList.toggle("hit", isPasta);
        if(isPasta){ hits++; misses = 0; } else { misses++; hits = 0; }
        if(!won && hits >= LIVE_HITS){ won = true; showResult(true, pct); $("status").textContent = ""; }
        else if(won && misses >= LIVE_MISSES){ won = false; clearResult(); }
        if(!won) $("status").textContent = "Δείξε μακαρόνια στην κάμερα… (" + pct + "% · " + fps.toFixed(1) + " καρέ/δευτ.)";
      }catch(e){ console.error(e); $("status").textContent = "Σφάλμα ανάλυσης καρέ: " + (e.message||e); await new Promise(r => setTimeout(r, 500)); }
    } else {
      await new Promise(r => setTimeout(r, 100));
    }
    await new Promise(r => setTimeout(r, 0)); // αφήνει τον browser να ζωγραφίσει
  }
}

/* ---------- Εναλλαγή λειτουργίας ---------- */
function setMode(cam){
  $("modeCam").setAttribute("aria-pressed", cam); $("modePhoto").setAttribute("aria-pressed", !cam);
  $("cam").classList.toggle("on", cam); drop.style.display = cam ? "none" : "flex";
  clearResult(); $("status").textContent = "";
  if(cam) startCamera(); else stopCamera();
}
$("modeCam").addEventListener("click", () => setMode(true));
$("modePhoto").addEventListener("click", () => setMode(false));
document.addEventListener("visibilitychange", () => { if(document.hidden) stopCamera(); else if($("modeCam").getAttribute("aria-pressed")==="true") startCamera(); });
setMode(true);
</script>
